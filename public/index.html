<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#14b8a6" />
    <title>DeltaV Telescreen</title>
    <link rel="stylesheet" href="https://css.deltavdevs.com/theme.css" />
    <link rel="stylesheet" href="https://css.deltavdevs.com/fonts.css" />
    <link rel="stylesheet" href="/telescreen.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="login" class="login" hidden>
      <div class="card login-card">
        <p class="eyebrow">deltavdevs / ops</p>
        <h1 class="ultratitle">Telescreen</h1>
        <p class="lead">Admin for the DeltaVDevs site, databases, caches, files and DeltaTime.</p>
        <p id="login-error" class="notice error" hidden></p>
        <a class="button-link" id="login-ward" href="/auth/ward/start" hidden><button class="cta lg" type="button" tabindex="-1">Continue with Ward</button></a>
        <a class="button-link" id="login-google" href="/auth/google/start" hidden><button class="outline" type="button" tabindex="-1">Sign in with Google (backup)</button></a>
        <p class="caption">Ward accounts with admin or owner access only. Everything you do here is audit-logged.</p>
      </div>
    </div>

    <div id="shell" class="shell" hidden>
      <aside class="rail">
        <div class="brand"><span class="brand-mark">Δ</span><span>Telescreen</span></div>
        <nav id="nav"></nav>
        <div class="rail-foot">
          <div id="me" class="me"></div>
          <button id="logout" class="outline small" type="button">Sign out</button>
        </div>
      </aside>
      <main id="view" class="view"></main>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
